table.res{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:15px}

<body>
<canvas id="game"></canvas><div id="paper"></div>

<div id="hud">
  <div id="hudL" class="hbox"><div id="hTime">0:00,0</div><div id="hDelta"></div><div id="hPen"></div></div>
  <div id="hudR" class="hbox"><canvas id="prof" width="300" height="88"></canvas><div id="hInfo"></div></div>
  <div id="hudB">
    <div class="meter"><span data-t="energy"></span><div class="bar"><i id="eBar"></i></div></div>
    <div class="meter"><span data-t="rhythm"></span><div class="bar rhythm"><i id="cMark"></i></div></div>
  </div>
  <div id="msg"></div>
</div>
<div id="topBtns"><button class="small" id="pauseBtn">II</button><button class="small" id="muteBtn">♪</button></div>

<div id="touch">
  <div class="tbtn" id="tl">◀</div>
  <div class="tbtn" id="tr">▶</div>
  <div class="tbtn" id="tp" data-t="pedal"></div>
</div>

<!-- Title -->
<div class="screen on" id="sTitle"><div class="card" style="position:relative">
  <div class="tiles"></div>
  <button class="small lang" id="langBtn">EN</button>
  <h1><small data-t="kicker"></small><span data-t="title"></span></h1>
  <p class="sub" data-t="sub"></p>
  <p data-t="hist1"></p>
  <p data-t="hist2"></p>
  <p data-t="hist3"></p>
  <div class="row">
    <button class="primary" id="bPlay" data-t="play"></button>
    <button id="bHow" data-t="how"></button>
  </div>
  <p class="note" data-t="disclaimer"></p>
</div></div>

<!-- How to play -->
<div class="screen" id="sHow"><div class="card">
  <div class="tiles"></div>
  <h2 data-t="how"></h2>
  <ul class="howlist">
    <li data-t="h1"></li><li data-t="h2"></li><li data-t="h3"></li><li data-t="h4"></li><li data-t="h5"></li><li data-t="h6"></li>
  </ul>
  <div class="row"><button class="primary" id="bHowPlay" data-t="play"></button><button id="bHowBack" data-t="back"></button></div>
</div></div>

<!-- Category -->
<div class="screen" id="sCat"><div class="card">
  <div class="tiles"></div>
  <h2 data-t="choose"></h2>
  <div class="cats" id="cats"></div>

</div></div>

  <h2 data-t="paused"></h2>
  <div class="row" style="justify-content:center"><button class="primary" id="bResume" data-t="resume"></button><button id="bQuit" data-t="quit"></button></div>
</div></div>

<!-- Results -->
<div class="screen" id="sRes"><div class="card">
  <div class="tiles"></div>
  <h2 data-t="result"></h2>
  <canvas id="trophy" width="360" height="340"></canvas>

  <div class="row"><button class="primary" id="bAgain" data-t="again"></button><button id="bChange" data-t="change"></button><button id="bMenu" data-t="menu"></button></div>
</div></div>

<script>

function simulate(cat){
  let z = Z0, v = 0, E = 100, t = 0; const dt = 1/30; const trace = new Float32Array(COURSE+2);
  const boosted = new Set(); let lastD = 0;
  while (z < Z0 + COURSE && t < 400){

    E += (1.0 - 2.8*eff*eff*cat.drain)*dt; if (E <= 0){ E = 0; eff = Math.min(eff, 0.5); } if (E > 100) E = 100;

    const d = Math.floor(z - Z0); while (lastD <= d && lastD <= COURSE){ trace[lastD++] = t; }
  }
  return {time:t, trace};
}
function accel(cat, eff, v, grade){
  const th = Math.atan(grade), g = 9.81, m = cat.m;
  let P = cat.P*eff;
  if (cat.assist && v < 6.9) P += Math.min(cat.assist, cat.assist*eff*1.15) * (v > 5.5 ? (6.9-v)/1.4 : 1);

function loadRecordings(){

const SHOUTS = [];
let recentShouts = [];
function loadShouts(){
  SHOUT_DATA.forEach(b => {
    try { const bin = atob(b), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      AC.decodeAudioData(u.buffer).then(buf => SHOUTS.push(buf)).catch(() => {}); } catch (e) {}
  });
}
function playOneShout(vol, delay){
  // pick a voice not used in the last 6 shouts
  let k = 0, tries = 0; do { k = Math.floor(Math.random()*SHOUTS.length); tries++; } while (recentShouts.includes(k) && tries < 30);
  recentShouts.push(k); if (recentShouts.length > Math.min(6, SHOUTS.length - 1)) recentShouts.shift();
  const t = AC.currentTime + (delay || 0);
  const src = AC.createBufferSource(); src.buffer = SHOUTS[k]; src.playbackRate.value = 0.88 + Math.random()*0.24;   // a bit faster/slower and higher/lower each time
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3500 + Math.random()*5000;   // nearer or further away
  const g = AC.createGain(); g.gain.value = vol;
  const pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
  src.connect(lp).connect(g);
  if (pan){ pan.pan.value = Math.random()*1.2 - 0.6; g.connect(pan).connect(crowdGain); } else g.connect(crowdGain);
  src.start(t);
}
function playShout(vol){
  if (!AC || muted || !SHOUTS.length) return false;
  const v = 0.55 + vol*1.5;
  playOneShout(v, 0);
  if (Math.random() < 0.35) playOneShout(v*0.6, 0.12 + Math.random()*0.3);   // sometimes a second voice joins in
  return true;
}

let musicGain = null;
const SYNTH_SHOUTS = false;   // code-made shouts sounded robotic; real recordings will replace them
// ---------- crowd layers: many synthetic voices rendered once into short loops ----------
const LAYERS = {};   // chatter, cheer, applause: {gain}
function renderVoices(oc, secs, n, opts){
  const out = oc.destination;
  for (let v = 0; v < n; v++){
    const o = oc.createOscillator(); o.type = 'sawtooth';
    const base = opts.pitch[0] + Math.random()*(opts.pitch[1] - opts.pitch[0]);
    const g = oc.createGain(); g.gain.value = 0;
    const pan = oc.createStereoPanner(); pan.pan.value = Math.random()*1.8 - 0.9;
    const fs = [oc.createBiquadFilter(), oc.createBiquadFilter(), oc.createBiquadFilter()];
    const fq = [6, 9, 12], fg = [1, 0.6, 0.25];
    fs.forEach((f, k) => { f.type = 'bandpass'; f.Q.value = fq[k]; const fgn = oc.createGain(); fgn.gain.value = fg[k]; o.connect(f).connect(fgn).connect(g); });
    g.connect(pan).connect(out);
    // consonant clicks: short noise bursts through a high band
    const nb = oc.createBuffer(1, oc.sampleRate*secs, oc.sampleRate), nd = nb.getChannelData(0);
    let t = Math.random()*0.8;
    o.frequency.setValueAtTime(base, 0);
    while (t < secs - 0.3){
      const dur = opts.syl[0] + Math.random()*(opts.syl[1] - opts.syl[0]);
      const vw = VOWELS[Math.floor(Math.random()*VOWELS.length)];
      const vol = opts.vol*(0.5 + Math.random()*0.5);
      fs[0].frequency.setValueAtTime(vw[0]*(0.9 + Math.random()*0.2), t);
      fs[1].frequency.setValueAtTime(vw[1]*(0.9 + Math.random()*0.2), t);
      fs[2].frequency.setValueAtTime(2500 + Math.random()*400, t);
      const p0 = base*(0.9 + Math.random()*0.2), rise = opts.rise ? 1.25 + Math.random()*0.25 : 1 + (Math.random() - 0.5)*0.15;
      o.frequency.setValueAtTime(p0, t); o.frequency.linearRampToValueAtTime(p0*rise, t + dur*0.4); o.frequency.linearRampToValueAtTime(p0*(opts.rise ? 0.85 : 0.95), t + dur);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(0.03, dur*0.2)); g.gain.setValueAtTime(vol*0.85, t + dur*0.75); g.gain.linearRampToValueAtTime(0, t + dur);
      if (Math.random() < 0.6){ const i0 = Math.floor(Math.max(0, t - 0.02)*oc.sampleRate), i1 = i0 + Math.floor(0.025*oc.sampleRate); for (let i = i0; i < i1 && i < nd.length; i++) nd[i] = (Math.random()*2 - 1)*opts.vol*0.5; }
      t += dur + opts.gap[0] + Math.random()*(opts.gap[1] - opts.gap[0]);
      if (Math.random() < opts.pause) t += 0.3 + Math.random()*0.9;
    }
    const ns = oc.createBufferSource(); ns.buffer = nb; const hp = oc.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
    ns.connect(hp).connect(pan); ns.start(0);

  }
}
function renderClaps(oc, secs, rate, vol){
  const b = oc.createBuffer(2, oc.sampleRate*secs, oc.sampleRate);
  for (let ch = 0; ch < 2; ch++){
    const d = b.getChannelData(ch);
    const n = Math.floor(secs*rate);
    for (let k = 0; k < n; k++){
      const i0 = Math.floor(Math.random()*(d.length - 2000)), L = 300 + Math.floor(Math.random()*500), a = vol*(0.4 + Math.random()*0.6);
      for (let i = 0; i < L; i++) d[i0 + i] += (Math.random()*2 - 1)*a*Math.exp(-i/(L*0.25));
    }
  }
  const src = oc.createBufferSource(); src.buffer = b;
  const bp = oc.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 0.7;
  src.connect(bp).connect(oc.destination); src.start(0);

function buildCrowdLayers(){
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext; if (!OC) return;
  const SR = 22050, SECS = 7;
  const make = (name, fill, level) => {
    let oc; try { oc = new OC(2, SR*SECS, SR); } catch (e) { return; }
    fill(oc, SECS);
    oc.startRendering().then(buf => {
      // fade the loop ends into each other so the seam is not heard
      for (let ch = 0; ch < buf.numberOfChannels; ch++){ const d = buf.getChannelData(ch), F = Math.floor(SR*0.4); for (let i = 0; i < F; i++){ const w = i/F; d[i] = d[i]*w + d[d.length - F + i]*(1 - w); } }
      const src = AC.createBufferSource(); src.buffer = buf; src.loop = true; src.loopEnd = SECS - 0.4;
      const g = AC.createGain(); g.gain.value = level; src.connect(g).connect(crowdGain); src.start(0, Math.random()*SECS*0.8);
      LAYERS[name] = g;
    }).catch(() => {});
  };
  make('chatter', (oc, S) => renderVoices(oc, S, 36, {pitch:[95, 240], syl:[0.08, 0.2], gap:[0.02, 0.12], pause:0.12, vol:0.11, rise:false}), 0.6);
  if (SYNTH_SHOUTS) make('cheer', (oc, S) => { renderVoices(oc, S, 30, {pitch:[160, 360], syl:[0.35, 1.1], gap:[0.05, 0.5], pause:0.25, vol:0.13, rise:true}); renderClaps(oc, S, 40, 0.2); }, 0);

}
const VOWELS = [[750,1200],[600,1700],[500,900],[700,1100],[450,1900]];

function voice(vol, when){

// ---------- update ----------
function once(key, text, dur){ if (!G.msgs[key]){ G.msgs[key] = true; msg(text, dur); } }
function update(dt){
  G.t += dt;
  if (msgTimer > 0){ msgTimer -= dt; if (msgTimer <= 0) $('msg').classList.remove('on'); }
  const cat = CATS[catIdx];

  if (G.state === 'count'){
    const before = Math.ceil(G.cd); G.cd -= dt; const after = Math.ceil(G.cd);
    if (after !== before && after > 0 && after <= 3){ msg(String(after), 0.8, true); megaBeep(620, 0.32, 0.5); }
    if (G.cd <= 0){ G.state = 'race'; msg(T('gogo'), 1.0, true); megaBeep(930, 0.6, 0.55); cheer(1); startMusic(); setTimeout(() => shout('bora', 0.3), 450); }
  }

  if (G.state === 'race' || G.state === 'finish'){
    const racing = G.state === 'race';
    if (racing) G.time += dt;
    // cadence from recent taps
    const now = performance.now()/1000;
    while (G.taps.length && now - G.taps[0] > 1.25) G.taps.shift();
    let c = 0;
    const nT = G.taps.length;
    if (nT >= 3){
      c = (nT - 1) / Math.max(0.2, G.taps[nT-1] - G.taps[0]);
      const since = now - G.taps[nT-1];
      if (since > 1.4/c) c = Math.min(c, 1/since);
    } else if (nT === 2) c = Math.min(2.5, 1/Math.max(0.2, G.taps[1] - G.taps[0]));
    else if (nT === 1) c = 0.8;
    G.cad += (c - G.cad) * Math.min(1, dt*8);
    if (!racing) G.cad *= Math.max(0, 1 - dt*2);

    let eff = Math.min(1, G.cad / CAD_FULL);
    const grade = gradeAt(G.z);
    // slipping on steep cobbles
    if (racing && G.cad > cat.slipC && grade > 0.085 && G.slip <= 0 && G.fd <= 0){ G.slip = 0.7; msg(T('slip'), 1.1); skid(); }
    if (G.slip > 0){ G.slip -= dt; eff *= 0.25; }
    // energy
    G.E += (1.0 - 2.8*eff*eff*cat.drain) * dt;
    if (G.E <= 0){ G.E = 0; if (eff > 0.5){ eff = 0.5; if (racing && !G.msgs.emptyShown){ G.msgs.emptyShown = true; msg(T('empty'), 1.6); } } }
    if (G.E > 25) G.msgs.emptyShown = false;
    if (G.E > 100) G.E = 100;
    if (!racing) eff = 0;
    G.eff = eff;

    if (G.fd > 0){
      G.fd -= dt; G.v = 0;
      if (G.fd <= 0){ G.grace = 2.2; G.taps = []; }
    } else {
      const a = accel(cat, eff, G.v, grade);
      G.v = Math.max(0, G.v + a*dt);
      if (!racing){ G.v *= Math.max(0, 1 - dt*1.2); if (G.z > Z0 + COURSE + 6.5){ G.z = Z0 + COURSE + 6.5; G.v = 0; } }
      G.z += G.v*dt;
      G.phase += G.v*dt*2.4;
    }
    G.grace -= dt;

    // lateral: steering, bends, wobble
    const steer = ((keys.r || touchR) ? 1 : 0) - ((keys.l || touchL) ? 1 : 0);
    G.steer += (steer - G.steer) * Math.min(1, dt*10);
    const wob = Math.max(0, Math.min(1, (2.6 - G.v)/2.6)) * (racing && G.fd <= 0 ? 1 : 0) + (G.slip > 0 ? 0.9 : 0);
    const noise = Math.sin(G.t*1.7 + 1.3)*Math.sin(G.t*0.67) + 0.5*Math.sin(G.t*3.1);
    G.drift += (noise*wob*0.85 - G.drift) * Math.min(1, dt*3);
    if (G.fd <= 0){
      G.x += G.steer * (1.25 + G.v*0.08) * dt;
      G.x -= curveAt(G.z) * G.v * G.v * 1.6 * dt;
      G.x += G.drift * dt;
    }
    G.lean += ((G.drift*0.22 + G.steer*0.1 + Math.sin(G.phase)*0.05*G.eff) - G.lean) * Math.min(1, dt*6);

    if (G.z - Z0 < 1.5) G.x = Math.max(-0.55, Math.min(0.55, G.x));
    updateExtras(dt);
    // crowd contact
    const gO = gapOpenAt(G.z - Z0), lim = gO - 0.6;
    const ax = Math.abs(G.x);
    if (racing && G.fd <= 0 && ax > lim){
      if (ax > gO - 0.18){ footDown(); G.x = Math.sign(G.x)*(lim - 0.35); }
      else {
        G.v *= Math.exp(-2.6*dt);
        G.x = Math.sign(G.x) * (lim + (ax - lim) * Math.exp(-3*dt));
        G.brushT -= dt;
        if (G.brushT <= 0){
          G.brushT = 1.6;
          const dd2 = G.z - Z0;
          if (dd2 > 140 && dd2 < 235 && Math.random() < 0.4){ G.v += 1.6; G.x *= 0.6; msg(T('push'), 1.1); cheer(0.8); shout('bora', 0.3); }
          else { msg(T('crowd'), 1.0); thud(); }
        }
      }
    }
    // stall
    if (racing && G.fd <= 0 && G.grace <= 0 && G.v < 0.55 && G.cad < 1.6) G.stall += dt; else G.stall = 0;
    if (G.stall > 1.1) footDown();

    // balconies boost
    if (racing) for (const b of balconies){
      if (b.star && !b.boosted && G.z >= b.z0 + 1){ b.boosted = true; G.E = Math.min(100, G.E + 6); msg(T('balcony'), 1.1); cheer(0.7); vai(0.25); }
    }
    // milestones
    const d = G.z - Z0;
    if (racing){
      if (d > 146) once('steep', T('steep'), 1.3);
      if (d > 225) once('half', T('half'), 1.2);
      if (d > 400 && !G.msgs.last) vai(0.32);
      if (d > 400) once('last', T('last'), 1.3);
      if (d >= COURSE) finishRace();
    } else {
      G.finT += dt; if (G.finT > 2.6 && G.state === 'finish') showResults();
    }
    // camera
    camX += ((CAMN ? G.x : G.x*0.62) - camX) * Math.min(1, dt*5);
    // HUD
    hud(d);
  } else if (G.state === 'title' || G.state === 'count'){
    camX += (0 - camX) * Math.min(1, dt*3);
  }
  soundTick(dt); updateSmoke(dt);
  // confetti
  for (const c of confetti){ c.x += c.vx*dt; c.y += c.vy*dt; c.r += dt*4; }
}
function footDown(){
  if (G.fd > 0) return;
  G.fd = 1.3; G.v = 0; G.pen += 5; G.footSide = G.x > 0 ? -1 : 1; G.stall = 0; G.slip = 0;
  msg(T('foot'), 1.4); thud();
}

let profBase = null;
function drawProfileBase(){
  const c = $('prof'), x = c.getContext('2d'); const w = c.width, h = c.height;
  x.clearRect(0,0,w,h);
  const y0 = segY[Z0], y1 = segY[Z0+COURSE];
  x.beginPath(); x.moveTo(0,h);
  for (let d = 0; d <= COURSE; d += 5){ x.lineTo(d/COURSE*w, h - 6 - (segY[Z0+d]-y0)/(y1-y0)*(h-14)); }
  x.lineTo(w,h); x.closePath(); x.fillStyle = '#c9b79c'; x.fill();
  x.strokeStyle = '#1d2433'; x.lineWidth = 3; x.beginPath();
  for (let d = 0; d <= COURSE; d += 5){ const px = d/COURSE*w, py = h - 6 - (segY[Z0+d]-y0)/(y1-y0)*(h-14); d ? x.lineTo(px,py) : x.moveTo(px,py); }
  x.stroke();
  profBase = x.getImageData(0,0,w,h);
}
function hud(d){

    const delta = total - lead;

  } else if (G.state === 'race') $('hDelta').textContent = '';

  $('hInfo').textContent = Math.min(COURSE, Math.max(0, Math.round(d))) + ' / ' + COURSE + ' m · ' + Math.round(G.v*3.6) + ' km/h · ' + Math.round(gradeAt(G.z)*100) + '%';
  $('eBar').style.width = G.E.toFixed(1) + '%';

    x.fillStyle = cat.col; x.strokeStyle = '#1d2433'; x.lineWidth = 3; x.beginPath(); x.arc(px, py, 7, 0, 6.29); x.fill(); x.stroke();
  }
}

// ---------- drawing: people ----------
function drawFan(f, sx, sy, s, excite, t, back){
  if (STYLE === 'pixel') return drawFanPx(f, sx, sy, s, excite, t, back);
  const h = f.h * s;             // pixel scale for this fan (1 m = s px, times body scale)
  if (h * 1.7 < 5){              // tiny: blob
    ctx.fillStyle = C(f.shirt); ctx.fillRect(sx - 0.22*h, sy - 1.45*h, 0.44*h, 0.75*h);
    ctx.fillStyle = C(f.skin); ctx.fillRect(sx - 0.1*h, sy - 1.68*h, 0.2*h, 0.22*h);
    ctx.fillStyle = C(f.pants); ctx.fillRect(sx - 0.18*h, sy - 0.75*h, 0.36*h, 0.75*h);
    return;
  }
  const k = h; const w = f.wide;
  const sp = f.sp * (1 + excite*1.6);
  const tt = t*sp*4 + f.ph;
  const bounce = Math.max(0, Math.sin(tt*1.1)) * 0.07 * excite;
  ctx.save(); ctx.translate(sx, sy - bounce*k);
  // legs
  ctx.fillStyle = C(f.pants);
  ctx.fillRect(-0.17*w*k, -0.82*k, 0.15*k, 0.82*k);
  ctx.fillRect(0.02*w*k, -0.82*k, 0.15*k, 0.82*k);
  // shoes
  ctx.fillStyle = C(back ? f.pants : f.hair);
  ctx.fillRect(-0.19*w*k, -0.06*k, 0.18*k, 0.06*k); ctx.fillRect(0.02*w*k, -0.06*k, 0.18*k, 0.06*k);
  // arms (behind body when down)
  const sh = -1.36*k, sl = -0.21*w*k, sr = 0.21*w*k;
  let la, ra; // angles from straight down (radians, positive = outward/up)
  switch (f.arm){
    case 0: la = 2.5 + Math.sin(tt)*0.5*(0.4+excite); ra = 2.5 + Math.sin(tt+1.4)*0.5*(0.4+excite); break;     // waving both
    case 1: la = 1.0 + Math.abs(Math.sin(tt*1.6))*0.5; ra = la; break;                                               // clapping
    case 2: la = 0.3; ra = 2.6 + Math.sin(tt)*0.25; break;                                                           // flag
    case 3: la = 0.25; ra = 2.0; break;                                                                              // phone
    case 4: la = 0.35; ra = 2.7 + Math.max(0, Math.sin(tt*1.3))*0.35*excite; break;                                  // fist pump
    default: la = 2.3 + excite*0.5 + Math.sin(tt)*0.15; ra = la; break;                                              // hands up
  }
  if (excite < 0.25 && f.arm !== 2 && f.arm !== 3){ la = Math.min(la, 0.5 + excite); ra = Math.min(ra, 0.5 + excite); }
  ctx.lineCap = 'round'; ctx.lineWidth = 0.1*k; ctx.strokeStyle = C(f.shirt);
  const arm = (x0, dir, ang) => {
    const ex = x0 + dir*Math.sin(ang)*0.62*k, ey = sh + Math.cos(ang)*0.62*k;
    ctx.strokeStyle = C(f.shirt); ctx.beginPath(); ctx.moveTo(x0, sh); ctx.lineTo(x0 + (ex-x0)*0.5, sh + (ey-sh)*0.5); ctx.stroke();
    ctx.strokeStyle = C(f.skin); ctx.beginPath(); ctx.moveTo(x0 + (ex-x0)*0.5, sh + (ey-sh)*0.5); ctx.lineTo(ex, ey); ctx.stroke();
    return [ex, ey];
  };
  let clapX = 0;
  if (f.arm === 1){ clapX = Math.abs(Math.sin(tt*1.6))*0.12*k; }
  const L = arm(sl, -1, la);
  const R = arm(sr, 1, ra);
  // torso
  ctx.fillStyle = C(f.shirt);
  ctx.beginPath();
  ctx.moveTo(-0.24*w*k, -1.42*k); ctx.lineTo(0.24*w*k, -1.42*k); ctx.lineTo(0.2*w*k, -0.78*k); ctx.lineTo(-0.2*w*k, -0.78*k); ctx.closePath(); ctx.fill();
  if (f.arm === 1){ // clapping hands in front
    ctx.fillStyle = C(f.skin);
    ctx.beginPath(); ctx.arc(-0.05*k - clapX, -1.2*k, 0.055*k, 0, 6.29); ctx.arc(0.05*k + clapX, -1.2*k, 0.055*k, 0, 6.29); ctx.fill();
  }
  // head
  const hy = -1.58*k;
  ctx.fillStyle = C(f.skin); ctx.beginPath(); ctx.arc(0, hy, 0.13*k, 0, 6.29); ctx.fill();
  ctx.fillStyle = C(f.hair);
  if (back){ ctx.beginPath(); ctx.arc(0, hy, 0.135*k, 0, 6.29); ctx.fill(); }
  else switch (f.hs){
    case 0: ctx.beginPath(); ctx.arc(0, hy - 0.02*k, 0.135*k, Math.PI, 0); ctx.fill(); break;
    case 1: ctx.beginPath(); ctx.arc(0, hy - 0.02*k, 0.14*k, Math.PI, 0); ctx.fill(); ctx.fillRect(-0.14*k, hy - 0.03*k, 0.06*k, 0.2*k); ctx.fillRect(0.08*k, hy - 0.03*k, 0.06*k, 0.2*k); break;
    case 2: break;
    case 3: ctx.beginPath(); ctx.arc(0, hy - 0.03*k, 0.13*k, Math.PI, 0); ctx.fill(); ctx.beginPath(); ctx.arc(0, hy - 0.17*k, 0.06*k, 0, 6.29); ctx.fill(); break;

  }

  // face: open mouth when excited

    ctx.fillStyle = 'rgba(30,20,20,.75)';
    ctx.beginPath(); ctx.arc(-0.045*k, hy - 0.01*k, 0.016*k, 0, 6.29); ctx.arc(0.045*k, hy - 0.01*k, 0.016*k, 0, 6.29); ctx.fill();
    if (excite > 0.3){ ctx.beginPath(); ctx.ellipse(0, hy + 0.06*k, 0.04*k, 0.03*k + 0.02*k*Math.abs(Math.sin(tt*2)), 0, 0, 6.29); ctx.fill(); }
  }

    const wv = Math.sin(tt*2.2)*0.08*k;
    ctx.fillStyle = C(f.flag[0]); ctx.beginPath(); ctx.moveTo(fx, fy - 0.75*k); ctx.quadraticCurveTo(fx + 0.3*k, fy - 0.75*k + wv, fx + 0.6*k, fy - 0.72*k); ctx.lineTo(fx + 0.6*k, fy - 0.36*k); ctx.quadraticCurveTo(fx + 0.3*k, fy - 0.4*k + wv, fx, fy - 0.38*k); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C(f.flag[1]); ctx.beginPath(); ctx.moveTo(fx, fy - 0.56*k); ctx.quadraticCurveTo(fx + 0.3*k, fy - 0.57*k + wv, fx + 0.6*k, fy - 0.54*k); ctx.lineTo(fx + 0.6*k, fy - 0.36*k); ctx.quadraticCurveTo(fx + 0.3*k, fy - 0.4*k + wv, fx, fy - 0.38*k); ctx.closePath(); ctx.fill();

    ctx.fillStyle = C(f.kidHair); ctx.beginPath(); ctx.arc(0, -1.62*kk, 0.15*kk, Math.PI, 0); ctx.fill();

}

function drawRider(sx, sy, s){

  ctx.fillStyle = '#1d2433'; ctx.font = PXW + Math.round(0.11*k) + PXF; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

}
function drawRiderOverlay(){
  // rider fixed at the bottom centre of the screen; only helmet, shoulders and upper arms show
  if (STYLE === 'pixel') return drawRiderPx();
  const cat = CATS[catIdx], ph = G.phase;

  const rock = Math.sin(ph)*0.03*(0.3 + G.eff) + G.lean*0.5;
  const bob = Math.abs(Math.sin(ph))*0.012*k*(0.3 + G.eff);

  const barY = shY + 0.2*k, hx = 0.36*k;
  ctx.restore(); ctx.save(); ctx.translate(cx, base); ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  ctx.beginPath(); ctx.moveTo(-0.44*k, barY + 0.16*k); ctx.quadraticCurveTo(-0.46*k, barY, -0.38*k, barY); ctx.lineTo(0.38*k, barY); ctx.quadraticCurveTo(0.46*k, barY, 0.44*k, barY + 0.16*k); ctx.stroke();

  ctx.restore(); ctx.save(); ctx.translate(cx, base + bob); ctx.rotate(rock); ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  ctx.strokeStyle = '#d9a27e'; ctx.lineWidth = 0.075*k;

  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-hx, barY - 0.01*k, 0.05*k, 0, 6.29); ctx.arc(hx, barY - 0.01*k, 0.05*k, 0, 6.29); ctx.fill();

  // neck and helmet

// ---------- drawing: scene ----------
function fogLevel(z){ const f = Math.max(0, Math.min(1, (z - 18) / 90)); return Math.min(FOGN-1, Math.round(f*(FOGN-1))); }

function render(){
  const z0 = G.z;
  camZ = z0 - CAM_BACK;
  baseSeg = Math.floor(camZ);
  const bp = camZ - baseSeg;
  const gNow = gradeAt(z0);
  pitch += (gNow - pitch) * 0.08;
  camY = roadY(camZ) + CAM_H;
  // place the rider's wheel at ~80% of the screen height
  const anchor = H*(touchMode && W < H ? 0.7 : 0.8) - (camY - roadY(z0))*F/CAM_BACK;
  HY = CAMN ? H*0.5 : anchor*0.45 + H*0.24;

  // sky
  if (STYLE === 'pixel'){
    const bands = ['#3d7fc4','#4f93d4','#66a8e0','#82bce9','#a3d0f1','#c6e3f7','#e3f1fb'];
    let y = 0; for (let k2 = 0; k2 < bands.length; k2++){ const h2 = Math.ceil(H*(k2 < 6 ? 0.07 : 0.6)); ctx.fillStyle = bands[k2]; ctx.fillRect(0, y, W, h2); y += h2; }
  } else {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#5fa3dc'); sky.addColorStop(0.6, '#b9dcf3'); sky.addColorStop(1, '#e8f3fb');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  }
  // a few clouds

const PXS = [];   // PXS[variant][fogLevel][frame] = small canvas
function buildPixelSprites(){

  const OUT = '#1c1612';
  const skins = ['#f1c7a5','#e0ac85','#c68863','#a86b4a','#7c4a32','#5a3524'];
  const hairs = ['#2b1d16','#4a3021','#7a4b2a','#b88346','#d9c08a','#9a9a9a','#e8e8e8','#111111'];
  const shirts = ['#e63946','#f4a261','#2a9d8f','#264f9e','#f5f5f0','#ffd166','#8ecae6','#161616','#ef476f','#3a3a3a','#9b5de5','#2d6a4f','#ff8fab','#7a8a99','#c1121f','#d9c59a','#f5f5f0','#161616'];
  const pantsC = ['#2b3a55','#3d3d3d','#5c4b3b','#1f4e79','#6b705c','#222222','#4a6fa5','#4a6fa5'];
  const jackets = ['#4a6fa5','#6b4f3a','#2f3b2f','#8a8f96','#b5651d'];
  const poses = ['clap','clap','up','up','phone','phone','wave','fist','beer','sign','camera','camera'];
  const W2 = 22, H2 = 42;
  for (let v = 0; v < 60; v++){
    const look = {
      skin: pk(skins), hair: pk(hairs), shirt: pk(shirts), pants: pk(pantsC), jacket: pk(jackets),
      top: R() < 0.08 ? 'vest' : R() < 0.25 ? 'jacket' : R() < 0.35 ? 'dress' : 'tee',
      hairS: Math.floor(R()*5), cap: R() < 0.2 ? pk(shirts) : null, shades: R() < 0.25,
      shoes: R() < 0.5 ? '#f2f2f2' : '#2a2a2a', pose: pk(poses)

    if (look.top === 'vest') look.pose = R() < 0.5 ? 'clap' : 'wave';
    const levels = [];
    for (let fl = 0; fl < FOGN; fl++){
      const frames = [];
      for (let fr = 0; fr < 2; fr++) frames.push(paintFigure(look, fr, fl/(FOGN-1)*0.85, W2, H2, OUT));
      levels.push(frames);

function paintFigure(L, fr, fog, W2, H2, OUT){

    rect(8, 34, 2, 6, L.skin); rect(12, 34, 2, 6, L.skin);
  } else {
    rect(7, 27, 3, 13, L.pants); rect(12, 27, 3, 13, L.pants); rect(14, 27, 1, 13, dark(L.pants)); rect(7, 27, 8, 2, L.pants);

  rect(6, 15, 10, 12, torso); rect(14, 15, 2, 12, dark(torso));
  if (L.top === 'jacket'){ rect(10, 15, 2, 12, L.shirt); }

  if (L.top === 'dress'){ rect(6, 15, 10, 10, L.shirt); rect(14, 15, 2, 10, dark(L.shirt)); for (let k = 0; k < 6; k++) set(7 + (k*3)%9, 17 + (k*5)%12, '#ffffff'); }

    case 3: rect(8, 4, 6, 2, L.hair); rect(10, 2, 2, 2, L.hair); break;

    case 'up':   hl = fr ? [3, 3] : [4, 5]; hr = fr ? [18, 3] : [17, 5]; break;
    case 'wave': hr = fr ? [19, 6] : [17, 4]; break;
    case 'phone': hr = [14, 8 + fr]; break;
    case 'fist': hr = fr ? [16, 8] : [16, 3]; break;
    case 'beer': hr = fr ? [16, 9] : [17, 5]; break;

  rect(hl[0], hl[1], 2, 2, L.skin); rect(hr[0], hr[1], 2, 2, L.skin);

  if (L.pose === 'beer'){ rect(hr[0], hr[1] - 4, 2, 4, '#5a3a14'); set(hr[0], hr[1] - 5, '#5a3a14'); }

  if (L.pose === 'clip'){ rect(7, 18, 8, 7, '#c9a26b'); rect(8, 19, 6, 4, '#f2f2f2'); rect(9, 20, 4, 1, '#3a3a3a'); rect(9, 22, 3, 1, '#3a3a3a'); rect(10, 16, 2, 2, '#1b1b1b'); }
  if (L.pose === 'mega'){ rect(12, 9 - fr, 5, 4, '#d62839'); rect(17, 8 - fr, 2, 6, '#f2f2f2'); rect(13, 10 - fr, 2, 1, '#f2f2f2'); }
  if (L.pose === 'sign'){ rect(3, 0, 16, 5 - fr, '#c9a26b'); rect(5, 1, 3, 1, '#3a2a1a'); rect(9, 1, 5, 1, '#3a2a1a'); rect(6, 3 - fr, 8, 1, '#3a2a1a'); }
  // outline pass
  const out = g.slice();

    if (g[y*W2 + x]) continue;
    const nb = (x > 0 && g[y*W2 + x-1]) || (x < W2-1 && g[y*W2 + x+1]) || (y > 0 && g[(y-1)*W2 + x]) || (y < H2-1 && g[(y+1)*W2 + x]);

  return cv2;
}
function drawFanPx(f, sx, sy, s, excite, t, back){

      const flares = FINALE.filter(p => p.fan.flare);
      const p = flares[Math.floor(Math.random()*flares.length)];
      if (p) SMOKE.push({x: p.x + 0.1, z: p.z + 0.2, h: 2.2, vx: (Math.random() - 0.5)*0.6, vh: 0.8 + Math.random()*0.6, vz: (Math.random() - 0.3)*0.4,
                         r: 0.3, life: 0, max: 4 + Math.random()*3, col: Math.random() < 0.82 ? [205, 45, 55] : [70, 100, 210]});
    }
  }
  for (const m of SMOKE){ m.life += dt; m.x += m.vx*dt; m.h += m.vh*dt; m.z += m.vz*dt; m.r += dt*0.32; m.vh *= 0.995; }
  while (SMOKE.length && (SMOKE[0].life > SMOKE[0].max || SMOKE.length > 260)) SMOKE.shift();
}
function drawSmoke(){
  for (const m of SMOKE){
    const n = Math.floor(m.z) - baseSeg; if (n < 0 || n >= DRAW || !OK[n]) continue;
    P(n, m.z - Math.floor(m.z), m.x, m.h);
    const a = Math.min(1, m.life*2)*(1 - m.life/m.max)*0.3;
    ctx.fillStyle = 'rgba(' + m.col[0] + ',' + m.col[1] + ',' + m.col[2] + ',' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(_x, _y, m.r*_s, 0, 6.29); ctx.fill();
  }
}


// ---------- boosts held out from the crowd, and distracted spectators in the road ----------
const ITEMS = [], OBSTACLES = [];
const EXTRA_SKIP = [new Uint8Array(NSEG + 2), new Uint8Array(NSEG + 2)];
let EXTRA_PX = null;
function buildExtraSprites(){
  const mk = look => { const lv = []; for (let fl = 0; fl < FOGN; fl++) lv.push([0, 1].map(fr => paintFigure(look, fr, fl/(FOGN-1)*0.85, 22, 42, '#1c1612'))); return lv; };
  const BEERFAN = {skin:'#e0ac85', hair:'#2b1d16', shirt:'#0b7a3b', pants:'#2b3a55', jacket:'#161616', top:'tee', hairS:0, cap:'#c1121f', shades:false, shoes:'#f2f2f2'};
  const VENDOR  = {skin:'#c68863', hair:'#3d3d3d', shirt:'#f5f5f0', pants:'#3d3d3d', jacket:'#161616', top:'tee', hairS:2, cap:null, shades:false, shoes:'#2a2a2a'};
  const OFFER_W = 36, OFFER_OX = 10;                        // 22 px figure + room for the stretched arm
  const offer = (look, item, dir) => {
    const L = Object.assign({}, look, {pose:'offer', item, dir, ox: dir < 0 ? OFFER_OX : 0}), lv = [];
    for (let fl = 0; fl < FOGN; fl++) lv.push([0, 1].map(fr => paintFigure(L, fr, fl/(FOGN-1)*0.85, OFFER_W, 42, '#1c1612')));
    lv.ox = L.ox; return lv;
  };
  EXTRA_PX = {
    beerL: offer(BEERFAN, 'beer', -1), beerR: offer(BEERFAN, 'beer', 1),
    bifanaL: offer(VENDOR, 'bifana', -1), bifanaR: offer(VENDOR, 'bifana', 1),
    beerFan: mk({skin:'#e0ac85', hair:'#2b1d16', shirt:'#0b7a3b', pants:'#2b3a55', jacket:'#161616', top:'tee', hairS:0, cap:'#c1121f', shades:false, shoes:'#f2f2f2', pose:'clap'}),
    vendor:  mk({skin:'#c68863', hair:'#3d3d3d', shirt:'#f5f5f0', pants:'#3d3d3d', jacket:'#161616', top:'tee', hairS:2, cap:null, shades:false, shoes:'#2a2a2a', pose:'clap'}),
    phone1:  mk({skin:'#f1c7a5', hair:'#7a4b2a', shirt:'#ef476f', pants:'#4a6fa5', jacket:'#161616', top:'tee', hairS:1, cap:null, shades:true, shoes:'#f2f2f2', pose:'phone'}),
    phone2:  mk({skin:'#a86b4a', hair:'#111111', shirt:'#ffd166', pants:'#2b3a55', jacket:'#161616', top:'tee', hairS:0, cap:'#264f9e', shades:false, shoes:'#2a2a2a', pose:'phone'})
  };
}
buildExtraSprites();
function setupExtras(){
  ITEMS.length = 0; OBSTACLES.length = 0;
  const side = () => Math.random() < 0.5 ? -1 : 1;
  ITEMS.push({kind:'beer', z: Z0 + 150 + Math.random()*70, side: side(), taken:false});
  ITEMS.push({kind:'beer', z: Z0 + 300 + Math.random()*85, side: side(), taken:false});
  ITEMS.push({kind:'bifana', z: Z0 + 238 + Math.random()*40, side: side(), taken:false});
  OBSTACLES.push({z: Z0 + 315 + Math.random()*80, x: (Math.random() - 0.5)*1.2, hit:false, warned:false, out:0, px:'phone1'});
  EXTRA_SKIP[0].fill(0); EXTRA_SKIP[1].fill(0);
  for (const it of ITEMS){ const sd = it.side > 0 ? 1 : 0, i0 = Math.floor(it.z); for (let i = i0 - 3; i <= i0 + 1; i++) EXTRA_SKIP[sd][i] = 1; }
  if (Math.random() < 0.5) OBSTACLES.push({z: Z0 + 160 + Math.random()*55, x: (Math.random() < 0.5 ? -1 : 1)*(0.25 + Math.random()*0.15), hit:false, warned:false, out:0, px:'phone2'});
}
setupExtras();
// where the hand with the item is, across the street
function itemX(it){ return it.side*(gapOpenAt(it.z - Z0) - 0.88); }
const ITEM_REVEAL = 10;                                   // metres: items are only seen from this close
function updateExtras(dt){
  if (G.state !== 'race') return;
  for (const it of ITEMS){
    if (it.taken || Math.abs(G.z - it.z) > 0.7) continue;
    if (Math.abs(G.x - itemX(it)) < 0.42){
      it.taken = true;
      if (it.kind === 'beer'){ G.E = Math.min(100, G.E + 15); G.beerT = 3; msg(T('beer'), 1.2); tone(1900, 0.06, 'square', 0.08); tone(2400, 0.08, 'square', 0.06, 0.07); }
      else { G.bifT = 8; msg(T('bifana'), 1.2); tone(500, 0.08, 'square', 0.1); tone(700, 0.1, 'square', 0.08, 0.08); }
      cheer(0.6);
    }
  }
  if (G.bifT > 0){ G.bifT -= dt; G.E = Math.min(100, G.E + 2.5*dt); }
  if (G.beerT > 0){ G.beerT -= dt; G.x += Math.sin(G.t*4.3)*0.55*dt; }
  for (const o of OBSTACLES){
    const dz = o.z - G.z;
    if (!o.warned && dz < 26 && dz > 0){ o.warned = true; msg(T('watch'), 1.6); whistle(0.12); }
    if (o.hit){ o.out = Math.min(1, o.out + dt*1.5); continue; }
    if (Math.abs(dz) < 0.45 && Math.abs(G.x - o.x) < 0.5 && G.fd <= 0){ o.hit = true; footDown(); msg(T('sorry'), 1.4); }
  }
}
function obstacleX(o){ return o.x + (o.out ? (o.x >= 0 ? 1 : -1)*o.out*1.8 : 0); }
// comic speech balloon shouted by a character: (hx, hy) = the speaker's mouth, k = metres to pixels there,
// it appears only once the speaker is big enough on screen, and pops up over the next few metres
const BALLOON_K = 20;                                    // pixels per metre at the speaker (person about 36 px tall)
function balloonShown(k){ return k >= BALLOON_K; }
function drawBalloon(text, hx, hy, k){
  if (!balloonShown(k)) return;
  const pop = Math.min(1, (k - BALLOON_K)/8);
  const fs = k < 120 ? 8 : 16; ctx.font = PXW + fs + PXF;   // the pixel font is only sharp at 8 px steps
  const tw = ctx.measureText(text).width, pw = Math.round(tw + fs*1.6), ph = Math.round(fs*2.2);
  const sc = pop < 1 ? 0.4 + 0.6*pop + Math.sin(pop*Math.PI)*0.2 : 1;   // grows past full size, then settles
  const wob = pop >= 1 ? Math.round(Math.sin(G.t*9 + hx*0.1)*1.2) : 0;   // little shouting shake
  // balloon above the head, leaning towards the middle of the street, kept on screen
  const cx = Math.round(Math.max(pw/2 + 3, Math.min(W - pw/2 - 3, hx + (hx < W/2 ? 1 : -1)*pw*0.45)));
  const by = Math.round(Math.max(ph + 3, hy - Math.max(6, 0.25*k)) + wob);   // bottom edge of the balloon
  ctx.save();
  ctx.translate(cx, by); ctx.scale(sc, sc);
  const x0 = -pw/2, y0 = -ph, r = Math.min(6, ph/3);
  const tx = Math.max(x0 + r + 2, Math.min(-x0 - r - 8, (hx - cx)/sc));     // tail start along the bottom edge
  const tipX = (hx - cx)/sc, tipY = Math.max(4, (hy - by)/sc);
  const shape = () => {
    ctx.beginPath(); ctx.moveTo(x0 + r, y0); ctx.lineTo(-x0 - r, y0); ctx.quadraticCurveTo(-x0, y0, -x0, y0 + r);
    ctx.lineTo(-x0, -r); ctx.quadraticCurveTo(-x0, 0, -x0 - r, 0);
    ctx.lineTo(tx + 6, 0); ctx.lineTo(tipX, tipY); ctx.lineTo(tx, 0);
    ctx.lineTo(x0 + r, 0); ctx.quadraticCurveTo(x0, 0, x0, -r); ctx.lineTo(x0, y0 + r); ctx.quadraticCurveTo(x0, y0, x0 + r, y0); ctx.closePath();
  };
  shape(); ctx.lineWidth = 4; ctx.strokeStyle = '#1c1612'; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.fillStyle = '#fffdf6'; ctx.fill();
  ctx.fillStyle = '#1c1612'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, Math.round(-ph/2 + 1));
  ctx.restore();
}
function drawExtrasSeg(n, i){
  for (const it of ITEMS){
    if (Math.floor(it.z) !== i) continue;
    const t = it.z - i, gO = gapOpenAt(it.z - Z0), sg = it.side;
    const px0 = sg*(gO - 0.15);                               // the holder stands in the front row of the crowd
    P(n, t, px0, 0); if (_s < 1) continue;
    const beer = it.kind === 'beer', dz = it.z - G.z;
    // close by and not taken yet: arm held out to the road with the item (one sprite); otherwise clapping
    const offering = !it.taken && dz < ITEM_REVEAL;
    const spr = offering ? EXTRA_PX[it.kind + (sg > 0 ? 'L' : 'R')] : (beer ? EXTRA_PX.beerFan : EXTRA_PX.vendor);
    if (offering){                                             // wider sprite: keep the body where a normal one would be
      const hpx = 1.8*_s, k = hpx/42, fr = (Math.floor(G.t*3) & 1), img = spr[FL][fr];
      ctx.imageSmoothingEnabled = STYLE !== 'pixel';
      ctx.drawImage(img, Math.round(_x - (11 + spr.ox)*k), Math.round(_y - 41*k), Math.round(img.width*k), Math.round(42*k));
    } else drawPerson(n, t, px0, spr);
    if (dz > 0){ P(n, t, px0, 1.65); drawBalloon(beer ? 'OLHA A MINI!!' : 'BIFANAS 3,50€!', _x, _y, _s); }
  }
  for (const o of OBSTACLES){
    if (Math.floor(o.z) !== i || o.out >= 1) continue;
    const t = o.z - i;
    drawPerson(n, t, obstacleX(o), EXTRA_PX[o.px]);
    const dz = o.z - G.z;
    if (!o.hit && dz > 0 && dz < 45){
      // camera flash from the phone held up in front of the face (sprite pixel 14,5)
      P(n, t, obstacleX(o), 0); const kp = 1.8*_s/42, px = _x + 3*kp, py = _y - 35.5*kp;
      const ph2 = (G.t*1.3 + o.z*0.37) % 1;          // about one photo every 0.8 s
      if (ph2 < 0.09 && kp > 0.12){
        const a = 1 - ph2/0.09, R2 = Math.max(6, 16*kp)*(0.7 + 0.6*a);
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,255,240,' + (0.55*a).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(px, py, R2, 0, 6.29); ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(px, py, Math.max(2, 3*kp), 0, 6.29); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')'; ctx.lineWidth = Math.max(1, kp); ctx.beginPath();
        for (let q = 0; q < 4; q++){ const an = q*Math.PI/4 + Math.PI/8, L = R2*1.5; ctx.moveTo(px - Math.cos(an)*L, py - Math.sin(an)*L); ctx.lineTo(px + Math.cos(an)*L, py + Math.sin(an)*L); }
        ctx.stroke();
      }
      P(n, t, obstacleX(o), 1.65); drawBalloon('CA GRANDA FOTO!', _x, _y, _s);
    }
  }
}

// ================= STYLE B: lithograph print =================
const INKS = ['#f2e8d0','#2a2320','#b8412f','#d9a441','#3f7f7a','#3d5a8a','#d98c7a','#6f8f4e','#8f877a','#e8c547','#c9b89a','#5b4636','#a7c4d6','#7d9cb8','#5f5b56','#77726b'];
let LUT = null, LUTD = null, LUM = null, INK32 = 0;
function buildLUT(){
  const rgb = INKS.map(hexRgb); LUT = new Uint32Array(32768); LUTD = new Uint32Array(32768);
  const pack = (r, g2, b) => (255 << 24) | (Math.round(b) << 16) | (Math.round(g2) << 8) | Math.round(r);
  INK32 = pack(...rgb[1]);
  for (let r = 0; r < 32; r++) for (let g2 = 0; g2 < 32; g2++) for (let b = 0; b < 32; b++){
    const R = r*8+4, G2 = g2*8+4, B = b*8+4; let best = 0, bd = 1e9;
    for (let k = 0; k < rgb.length; k++){ const c = rgb[k]; const d = 2*(R-c[0])**2 + 4*(G2-c[1])**2 + 3*(B-c[2])**2; if (d < bd){ bd = d; best = k; } }
    const c = rgb[best], idx = (r<<10)|(g2<<5)|b;
    LUT[idx] = pack(c[0], c[1], c[2]); LUTD[idx] = pack(c[0]*0.62, c[1]*0.62, c[2]*0.62);
  }
}
function lithoPost(){
  const img = ctx.getImageData(0, 0, W, H), d = img.data, n = W*H, px = new Uint32Array(d.buffer);
  if (!LUM || LUM.length !== n) LUM = new Uint8Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) LUM[i] = (77*d[j] + 151*d[j+1] + 28*d[j+2]) >> 8;
  for (let y = 0; y < H; y++){
    const row = y*W, lastRow = y === H-1;
    for (let x = 0; x < W; x++){
      const i = row + x, L = LUM[i];
      const e = (x < W-1 ? Math.abs(L - LUM[i+1]) : 0) + (lastRow ? 0 : Math.abs(L - LUM[i+W]));
      if (e > 40){ px[i] = INK32; continue; }
      const v = px[i], idx = ((v & 0xf8) << 7) | ((v >> 6) & 0x3e0) | ((v >> 19) & 0x1f);
      if (L < 72 && ((x + y) & 3) === 0) px[i] = INK32;
      else if (L < 115 && ((x - y + 4000) % 5) === 0) px[i] = LUTD[idx];
      else px[i] = LUT[idx];
    }
  }
  ctx.putImageData(img, 0, 0);
}
if (STYLE === 'litho'){
  document.body.classList.add('litho'); buildLUT();
  const pc = document.createElement('canvas'); pc.width = pc.height = 220; const px = pc.getContext('2d'); const id = px.createImageData(220, 220);
  for (let i = 0; i < id.data.length; i += 4){ const v = 225 + Math.random()*30 - (Math.random() < 0.02 ? 40 : 0); id.data[i] = v; id.data[i+1] = v*0.97; id.data[i+2] = v*0.9; id.data[i+3] = 255; }
  px.putImageData(id, 0, 0); document.getElementById('paper').style.background = 'url(' + pc.toDataURL() + ')';
}

// ================= demo ride (bot pedals and steers) =================
if (DEMO){
  const go = () => { confetti = []; catIdx = +(QS.get('cat') || 2); updateRhythmZones(); startRace(); G.cd = 0.05; G.z = Z0 + +(QS.get('from') || 0); };
  setTimeout(go, 300 + Math.random()*300);
  setInterval(() => {
    if (G.state === 'pause'){ G.state = G.prev || 'race'; show(null); }
    if (G.state === 'race') pedalTap();
    let tx = 0;
    for (const it of ITEMS){ const dz = it.z - G.z; if (!it.taken && dz > 0 && dz < 14) tx = itemX(it)*0.85; }
    for (const o of OBSTACLES){ const dz = o.z - G.z; if (!o.hit && dz > -1 && dz < 22){ const lim = gapOpenAt(G.z - Z0) - 0.7; tx = Math.max(-lim, Math.min(lim, o.x >= 0 ? o.x - 0.95 : o.x + 0.95)); } }
    keys.l = G.x > tx + 0.15; keys.r = G.x < tx - 0.15;
    if (G.state === 'results') go();
  }, 190);
}

// ---------- loop ----------
let last = performance.now();
function frame(now){
  let dt = (now - last)/1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (G.state !== 'pause') update(dt);
  if (G.state === 'title'){ G.z = Z0 - 0.5 + Math.sin(G.t*0.3)*0.4; }
  const t0 = performance.now();
  render(); if (STYLE === 'litho') lithoPost(); else if (STYLE === 'pixel') pixelPost();
  if (G.state === 'race' && !document.hidden){
    SLOW_EMA += ((performance.now() - t0) - SLOW_EMA) * 0.05;
    if (SLOW_EMA > 26 && SLOW_STEPS < 2 && STYLE === 'pixel'){ SLOW_STEPS++; PIXEL_BUDGET = Math.round(PIXEL_BUDGET * 0.7); SLOW_EMA = 0; resize(); }
  }
  requestAnimationFrame(frame);
}
applyLang();
updateRhythmZones();
const _origStart = startRace;
requestAnimationFrame(frame);
// keep rhythm-bar zones in sync with chosen category
$('bGo').onclick = () => { updateRhythmZones(); _origStart(); };
$('bAgain').onclick = () => { confetti = []; updateRhythmZones(); _origStart(); };
</script>
